services:
  - type: web
    name: ammart-api
    env: node
    region: singapore
    plan: free
    rootDir: apps/backend
    buildCommand: chmod +x ./render-build.sh && ./render-build.sh
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        value: https://ammart-api.onrender.com
      - key: FRONTEND_URL
        value: https://ammart-admin-panel.vercel.app
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FIREBASE_WEB_API_KEY
        value: AIzaSyDodj0NvApuNGGFmSwvBmVxsziEmqeucqk
      - key: FIREBASE_PROJECT_ID
        value: am-mart-267d8
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@am-mart-267d8.iam.gserviceaccount.com
      - key: ADMIN_EMAIL
        value: admin@ammart.com
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 200

      # ── Secrets: set once in Render dashboard, never in git ──────────────
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
